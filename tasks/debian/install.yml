---

- name: Ansible-WebUI | Install | Dependencies
  ansible.builtin.apt:
    name: ['git', 'git-lfs', 'sshpass']
    state: present

- name: Ansible-WebUI | Install | Python3
  ansible.builtin.apt:
    name: ['python3', 'python3-virtualenv', 'python3-pip']
    state: present

- name: Ansible-WebUI | Install
  ansible.builtin.pip:
    requirements: "{{ AW_HC.path.config }}/{{ AW_HC.file_requirements.pip }}"
    virtualenv: "{{ AW_CONFIG.path.venv }}"
    state: present
  notify: AW-restart

- name: Ansible-WebUI | Install | Startup-Script
  ansible.builtin.template:
    src: 'templates/usr/local/bin/ansible-webui-start.sh.j2'
    dest: '/usr/local/bin/ansible-webui-start.sh'
    mode: 0750
    owner: 'root'
    group: "{{ AW_HC.user }}"
  notify: AW-restart

- name: Ansible-WebUI | Install | Service
  ansible.builtin.template:
    src: 'templates/etc/systemd/system/ansible-webui.service.j2'
    dest: "/etc/systemd/system/ansible-webui.service"
    mode: 0644
  notify: AW-restart

- name: Ansible-WebUI | Install | Enabling Service
  ansible.builtin.systemd:
    name: 'ansible-webui.service'
    daemon_reload: true
    enabled: true
    state: 'started'
